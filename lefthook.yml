pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "*.{ts,tsx,json,css,md}"
      run: npx @biomejs/biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    biome-format:
      glob: "*.{ts,tsx,json,css,md}"
      run: npx @biomejs/biome format --write {staged_files}
      stage_fixed: true